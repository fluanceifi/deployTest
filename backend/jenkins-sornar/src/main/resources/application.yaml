spring:
  profiles:
    active: local
    group:
      local: local
      prod: prod

---
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: jdbc:mysql://localhost:3306/board_db?useSSL=false&serverTimezone=Asia/Seoul
    username: root
    password: 1234 # 로컬 DB 비밀번호로 변경 필요
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

server:
  port: 8080

---
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: jdbc:mysql://172.21.33.69:8650/board_db?useSSL=false&serverTimezone=Asia/Seoul
    username: prod_user # 운영 DB 계정으로 변경 필요
    password: prod_password # 운영 DB 비밀번호로 변경 필요
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

server:
  port: 8630