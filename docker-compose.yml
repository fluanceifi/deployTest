version: '3.8'

services:
  sw_team_7_nginx:
    image: nginx:alpine
    container_name: sw_team_7_nginx
    ports:
      - "8620:80"
    volumes:
      - /home/sw_team_7/deployTest/nginx/conf.d:/etc/nginx/conf.d
    networks:
      - app-network
    depends_on:
      - sw_team_7_spring_blue
      - sw_team_7_spring_green
    command: /bin/sh -c "until getent hosts spring-green && getent hosts spring-blue; do echo 'DNS 대기 중...'; sleep 1; done && exec nginx -g 'daemon off;'"

  sw_team_7_spring_blue:
    image: sw_team_7_spring:latest
    container_name: sw_team_7_spring_blue
    ports:
      - "8630:8080"
    env_file:
      - .env
    networks:
      app-network:
        aliases:
          - spring-blue

  sw_team_7_spring_green:
    image: sw_team_7_spring:latest
    container_name: sw_team_7_spring_green
    ports:
      - "8640:8080"
    env_file:
      - .env
    networks:
      app-network:
        aliases:
          - spring-green

networks: # 네트워크
  app-network:
    external: true
